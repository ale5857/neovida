{% extends 'base.html' %}

{% block content %}
<div class="container py-4">

    <h4><i class="fas fa-baby"></i> Registro de Nuevo Embarazo</h4>

    <form method="post">
        {% csrf_token %}

        <div class="row mt-4">

            <div class="col-md-6">
                <label>Fecha Última Regla (FUR)</label>
                <input type="date" name="fecha_ultima_regla" class="form-control" required>
            </div>

            <div class="col-md-3">
                <label>Peso previo al embarazo (kg)</label>
                <input type="number" step="0.01" name="peso_anterior" class="form-control">
            </div>

            <div class="col-md-3">
                <label>Talla (m)</label>
                <input type="number" step="0.01" name="talla" class="form-control">
            </div>

        </div>

        <div class="row mt-4">

            <div class="col-md-6">
                <label>¿Embarazo planeado?</label>
                <select name="embarazo_planeado" class="form-control">
                    <option value="True">Sí</option>
                    <option value="False">No</option>
                </select>
            </div>

            <div class="col-md-6">
                <label>¿Falla de método anticonceptivo?</label>
                <select name="falla_metodo" class="form-control">
                    <option value="False">No</option>
                    <option value="True">Sí</option>
                </select>
            </div>

        </div>

        <button type="submit" class="btn btn-success mt-4">
            <i class="fas fa-save"></i> Guardar Embarazo
        </button>

        <a href="{% url 'expedientes:ver_expediente' expediente.paciente.id %}"
           class="btn btn-secondary mt-4">
            Cancelar
        </a>

    </form>

</div>
{% endblock %}
