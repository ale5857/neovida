{% extends "base.html" %}

{% block title %}Paciente Creado | NeoVida{% endblock %}

{% block content %}
<div class="container py-5">

    <div class="card shadow-lg border-0 mx-auto" style="max-width: 600px;">
        
        <div class="card-header bg-success text-white text-center">
            <h4 class="mb-0">
                <i class="fas fa-check-circle me-2"></i>
                Paciente Creado Correctamente
            </h4>
        </div>

        <div class="card-body p-4">

            <h5 class="text-primary mb-3">
                {{ paciente.nombre_completo }}
            </h5>

            <div class="mb-3">
                <label class="form-label fw-bold">Usuario:</label>
                <div class="input-group">
                    <input type="text" id="usernameField" class="form-control" value="{{ username }}" readonly>
                    <button class="btn btn-outline-secondary" onclick="copiarTexto('usernameField')">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Contraseña:</label>
                <div class="input-group">
                    <input type="text" id="passwordField" class="form-control" value="{{ password }}" readonly>
                    <button class="btn btn-outline-secondary" onclick="copiarTexto('passwordField')">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
            </div>

            <div class="alert alert-warning text-center">
                ⚠ Guarde esta información. No volverá a mostrarse.
            </div>

            <div class="d-flex justify-content-between">
                <button class="btn btn-primary" onclick="copiarTodo()">
                    <i class="fas fa-copy me-2"></i>Copiar Todo
                </button>

                <a href="{% url 'panel_principal' %}" class="btn btn-success">
                    <i class="fas fa-check me-2"></i>Aceptar
                </a>
            </div>

        </div>
    </div>

</div>

<script>
function copiarTexto(id) {
    var campo = document.getElementById(id);
    campo.select();
    campo.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(campo.value);
    alert("Copiado al portapapeles");
}

function copiarTodo() {
    var user = document.getElementById("usernameField").value;
    var pass = document.getElementById("passwordField").value;
    navigator.clipboard.writeText("Usuario: " + user + "\nContraseña: " + pass);
    alert("Credenciales copiadas");
}
</script>

{% endblock %}
