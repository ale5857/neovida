{% load static %}

<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<title>NeoVida | Correo enviado</title>
<link rel="icon" href="{% static 'img/cuidado.png' %}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)),
    url("{% static 'img/mi_fondo.png' %}") center/cover no-repeat fixed;
    font-family:'Segoe UI';
}
.card{
    max-width:420px;
    border-radius:18px;
    border:none;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}
</style>

</head>
<body>

<div class="card p-4 text-center">
    <h4 class="mb-3">Revisa tu correo</h4>
    <p class="text-muted">
        Hemos enviado un enlace para restablecer tu contraseña.
        Si no lo ves, revisa la carpeta de spam.
    </p>

<a href="{% url 'usuarios:login' %}" class="btn btn-outline-secondary mt-3">
    Volver al inicio de sesión
</a>


</div>

</body>
</html>
