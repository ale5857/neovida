{% load static %}

<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<title>NeoVida | Nueva contraseña</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="{% static 'img/cuidado.png' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* ===== FONDO ===== */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.45)),
    url("{% static 'img/mi_fondo.png' %}") center/cover no-repeat fixed;

    font-family:'Segoe UI',system-ui;
}

/* ===== TARJETA ===== */
.reset-card{
    width:100%;
    max-width:430px;
    border:none;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.18);
    overflow:hidden;

    background:rgba(255,255,255,.75);
    backdrop-filter:blur(8px);
}

/* ===== CABECERA ===== */
.reset-header{
    background:linear-gradient(135deg,#e75480,#ff7aa2);
    color:white;
    text-align:center;
    padding:26px 22px 22px;
}

.reset-header h3{
    margin:8px 0 0;
    font-weight:700;
}

/* ===== INPUTS ===== */
.form-control{
    padding:13px 14px;
    border-radius:12px;
    border:1px solid #e3e6ea;
    background:#f7f9fc;
}

.form-control:focus{
    background:white;
    border-color:#e75480;
    box-shadow:0 0 0 3px rgba(231,84,128,.15);
}

/* ===== BOTÓN ===== */
.btn-main{
    background:linear-gradient(135deg,#e75480,#ff7aa2);
    border:none;
    border-radius:12px;
    padding:13px;
    font-weight:600;
}

.btn-main:hover{
    box-shadow:0 6px 18px rgba(231,84,128,.35);
}

</style>

</head>

<body>

<div class="card reset-card">

<div class="reset-header">
    <img src="{% static 'img/cuidado.png' %}" width="34">
    <h3>Nueva contraseña</h3>
    <small>Establece una contraseña segura</small>
</div>

<div class="card-body p-4">

    {% if validlink %}
    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Nueva contraseña</label>
            {{ form.new_password1 }}
        </div>

        <div class="mb-3">
            <label>Confirmar contraseña</label>
            {{ form.new_password2 }}
        </div>

        <button class="btn btn-main w-100">
            Guardar contraseña
        </button>
    </form>
    {% else %}
    <div class="alert alert-danger text-center">
        Este enlace ya fue usado o expiró.
    </div>

    <a href="{% url 'usuarios:password_reset' %}" class="btn btn-outline-danger w-100">
       Solicita uno nuevo para continuar.
    </a>
    {% endif %}

</div>

</div>

<script>
document.querySelectorAll("input").forEach(i=>i.classList.add("form-control"));
</script>

</body>
</html>
