{% load static %}

<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recuperar contraseña | NeoVida</title>
<link rel="icon" href="{% static 'img/cuidado.png' %}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)),
    url("{% static 'img/mi_fondo.png' %}") center/cover no-repeat fixed;
    font-family:'Segoe UI';
}

.card{
    max-width:420px;
    border-radius:18px;
    border:none;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.btn-main{
    background:#e75480;
    border:none;
    border-radius:12px;
    padding:12px;
    font-weight:600;
}
.btn-main:hover{ background:#c71585; }

</style>

</head>
<body>

<div class="card p-4">
<div class="text-center mb-3">
    <img src="{% static 'img/cuidado.png' %}" width="36" class="mb-2">
    <h3 class="fw-bold" style="color:#e75480;">NeoVida</h3>
    <small class="text-muted">Sistema de control prenatal</small>
</div>
<h4 class="text-center mb-3">Recuperar contraseña</h4>

<p class="text-muted text-center">
    Ingresa tu correo y te enviaremos un enlace para restablecerla.
</p>

<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        {{ form.email }}
    </div>

    <button class="btn btn-main w-100">
        Enviar enlace
    </button>
</form>

<div class="text-center mt-3">
    <a href="{% url 'usuarios:login' %}">Volver al inicio de sesión</a>
</div>

</div>

<script>
document.querySelectorAll("input").forEach(i=>i.classList.add("form-control"));
</script>

</body>
</html>
