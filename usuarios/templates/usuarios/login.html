{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - NeoVida</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="icon" href="{% static 'img/mi_fondo.png' %}" type="image/png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url("{% static 'img/mi_fondo.png' %}") no-repeat center center fixed;
            background-size: contain;
            animation: fadeInBg 2s ease;
            margin: 0;
            padding-bottom: 60px;
        }

        @keyframes fadeInBg {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .card-login {
            background-color: rgba(248, 215, 218, 0.9);
            border-radius: 15px;
            animation: slideUp 1s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .btn-rosado {
            background-color: #e75480;
            color: white;
            border: none;
            transition: background 0.3s;
            animation: pulse 1.5s infinite;
        }

        .btn-rosado:hover {
            background-color: #c71585;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 84, 128, 0.7); }
            70% { box-shadow: 0 0 10px 10px rgba(231, 84, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 84, 128, 0); }
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            color: #6b7280;
            text-align: center;
            padding: 12px;
            font-size: 0.9rem;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div class="row justify-content-center align-items-center" style="height: 100vh;">
    <div class="col-md-5">
        <div class="card shadow-lg card-login">
            <div class="card-header text-center" style="background-color:#e75480; color:white;">
                <img 
                    src="{% static 'img/cuidado.png' %}" 
                    alt="Icono de salud materna"
                    title="Sistema de control de embarazo"
                    style="width:28px;"
                >
                <h3 class="mt-2">Iniciar Sesión</h3>
            </div>

            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-rosado w-100">
                        Ingresar
                    </button>
                </form>

                {% if form.errors %}
                <div class="alert alert-danger mt-3 text-center">
                    Usuario o contraseña incorrectos.
                </div>
                {% endif %}
            </div>

            <div class="card-footer text-center text-muted">
                Sistema de Gestión de Embarazos · NeoVida
            </div>
        </div>
    </div>
</div>

<footer>
    © 2025 NeoVida — Sistema de Control Prenatal
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
