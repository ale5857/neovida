<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">

```
<link rel="icon" href="{% static 'img/mi_fondo.png' %}" type="image/png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body{
        background: linear-gradient(rgba(255,255,255,.85), rgba(255,255,255,.85)),
                    url("{% static 'img/mi_fondo.png' %}") no-repeat center center fixed;
        background-size: cover;
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        font-family:'Segoe UI',sans-serif;
    }

    .card-login{
        width:100%;
        max-width:400px;
        border-radius:18px;
        border:none;
        box-shadow:0 20px 40px rgba(0,0,0,.12);
        overflow:hidden;
    }

    .card-header{
        background:linear-gradient(135deg,#e75480,#c71585);
        color:white;
        text-align:center;
        padding:25px 20px 15px;
    }

    .card-header img{
        width:35px;
        margin-bottom:10px;
    }

    .form-control{
        border-radius:10px;
        padding:12px;
    }

    .btn-rosado{
        background:linear-gradient(135deg,#e75480,#c71585);
        border:none;
        border-radius:10px;
        padding:12px;
        font-weight:600;
        transition:.3s;
    }

    .btn-rosado:hover{
        transform:translateY(-2px);
        box-shadow:0 6px 18px rgba(231,84,128,.4);
    }

    .toggle-eye{
        position:absolute;
        right:15px;
        top:38px;
        cursor:pointer;
        font-size:18px;
        color:#999;
    }

    footer{
        position:fixed;
        bottom:0;
        width:100%;
        text-align:center;
        font-size:.85rem;
        color:#777;
    }
</style>
```

</head>

<body>

<div class="card card-login">
    <div class="card-header">
        <img src="{% static 'img/cuidado.png' %}" alt="">
        <h4 class="mt-2">NeoVida</h4>
        <small>Sistema de Control Prenatal</small>
    </div>

```
<div class="card-body p-4">

    {% if form.errors %}
    <div class="alert alert-danger text-center">
        Usuario o contraseña incorrectos
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>

        <div class="mb-3 position-relative">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" id="password" class="form-control" required>
            <span class="toggle-eye" onclick="togglePassword()">👁</span>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <input type="checkbox" name="remember"> Recordarme
            </div>
            <a href="{% url 'password_reset' %}" class="text-decoration-none">
                ¿Olvidaste tu contraseña?
            </a>
        </div>

        <button type="submit" class="btn btn-rosado w-100" id="loginBtn">
            Ingresar
        </button>
    </form>

</div>
```

</div>

<footer>
    © 2026 NeoVida — Sistema de Control Prenatal
</footer>

<script>
function togglePassword(){
    const pass=document.getElementById("password");
    pass.type=pass.type==="password"?"text":"password";
}

document.querySelector("form").addEventListener("submit",function(){
    const btn=document.getElementById("loginBtn");
    btn.innerHTML="Ingresando...";
    btn.disabled=true;
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
